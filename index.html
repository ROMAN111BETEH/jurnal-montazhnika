<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Журнал монтажника</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #7b8794;
      --line: #e4e8ed;
      --blue: #248cff;
      --green: #27a866;
      --orange: #f2a33a;
      --red: #df6262;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 95px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #e8f2ff;
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    /* STATISTICS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 10px;
    }

    .stat-number {
      display: block;
      font-size: 22px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    /* MAIN MENU */

    .main-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .menu-button {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      color: var(--text);
      min-height: 78px;
    }

    .menu-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 6px;
    }

    .menu-title {
      font-weight: 750;
    }

    .menu-description {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .new-button {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    /* SECTION */

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 18px 0 10px;
    }

    /* STATUS TABS */

    .status-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      background: #e8ecf0;
      padding: 4px;
      border-radius: 13px;
      margin-bottom: 12px;
    }

    .status-tab {
      background: transparent;
      border: 0;
      border-radius: 10px;
      padding: 10px 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .status-tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* JOB CARD */

    .job-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .job-name {
      font-size: 17px;
      font-weight: 800;
    }

    .job-type {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .status {
      padding: 5px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      height: fit-content;
    }

    .status-planned {
      background: #fff1dc;
      color: #a86514;
    }

    .status-upcoming {
      background: #e8f2ff;
      color: #2670c1;
    }

    .status-done {
      background: #e5f7ed;
      color: #258253;
    }

    .job-info {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      color: #4f5b66;
      font-size: 13px;
    }

    .job-description {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.4;
      color: #68737e;
    }

    .job-price {
      margin-top: 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .job-actions button {
      background: #f0f2f4;
      color: #29333d;
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .job-actions .next {
      background: #e7f3ff;
      color: #1675c6;
    }

    .job-actions .complete {
      background: #e6f7ed;
      color: #228052;
    }

    .job-actions .delete {
      background: #ffe9e9;
      color: #c0392b;
    }

    /* CALENDAR */

    .calendar {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .calendar-header button {
      width: 36px;
      height: 36px;
      border: 0;
      background: #f0f2f4;
      border-radius: 10px;
      font-size: 20px;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .week div {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      padding: 5px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day {
      min-height: 43px;
      border: 0;
      border-radius: 9px;
      background: #fafbfc;
      font-size: 12px;
      position: relative;
    }

    .day.has-job {
      background: #edf6ff;
      color: #1776c4;
      font-weight: 800;
    }

    .day.selected {
      outline: 2px solid var(--blue);
    }

    .day-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--blue);
      margin: 3px auto 0;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      color: var(--muted);
      background: white;
      border: 1px dashed #d7dce1;
      border-radius: 16px;
      padding: 28px 12px;
    }

    /* SEARCH */

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      padding: 12px;
      outline: none;
      margin-bottom: 12px;
    }

    /* BOTTOM MENU */

    .bottom-menu {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      z-index: 20;
    }

    .bottom-inner {
      max-width: 760px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px env(safe-area-inset-bottom);
    }

    .bottom-button {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 11px;
      padding: 7px;
    }

    .bottom-button span {
      display: block;
      font-size: 19px;
      margin-bottom: 2px;
    }

    .bottom-button.active {
      color: var(--blue);
      font-weight: 800;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 760px;
      margin: auto auto 0;
      border-radius: 22px 22px 0 0;
      padding: 18px;
      max-height: 92%;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    .form label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .form input,
    .form select,
    .form textarea {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fafbfc;
      color: var(--text);
      outline: none;
    }

    .form textarea {
      min-height: 85px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 5px;
    }

    .modal-buttons button {
      padding: 13px;
      border-radius: 12px;
      border: 0;
      font-weight: 800;
    }

    .cancel {
      background: #eef0f2;
    }

    .save {
      background: var(--blue);
      color: white;
    }

    /* CLIENT */

    .client-delete {
      background: #ffe9e9 !important;
      color: #c0392b !important;
    }

    @media (min-width: 600px) {
      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-content {
        border-radius: 20px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div>
      <div class="title">Журнал монтажника</div>
      <div class="subtitle" id="hello">Рабочий журнал</div>
    </div>

    <div class="avatar" id="avatar">М</div>

  </header>

  <main id="content"></main>

</div>


<!-- НИЖНЕЕ МЕНЮ -->

<nav class="bottom-menu">

  <div class="bottom-inner">

    <button class="bottom-button active" data-page="home">
      <span>🏠</span>
      Главная
    </button>

    <button class="bottom-button" data-page="calendar">
      <span>📅</span>
      Календарь
    </button>

    <button class="bottom-button" data-page="jobs">
      <span>📋</span>
      Монтажи
    </button>

    <button class="bottom-button" data-page="clients">
      <span>👤</span>
      Клиенты
    </button>

  </div>

</nav>


<!-- МОДАЛЬНОЕ ОКНО -->

<div class="modal" id="modal">

  <div class="modal-content">

    <div class="modal-title" id="modalTitle">
      Новый монтаж
    </div>

    <form class="form" id="jobForm">

      <input type="hidden" id="editId">

      <label>
        Клиент
        <input id="name" required placeholder="Имя клиента">
      </label>

      <div class="form-row">

        <label>
          Телефон
          <input id="phone" type="tel" placeholder="+7...">
        </label>

        <label>
          Стоимость
          <input id="price" type="number" min="0" placeholder="35000">
        </label>

      </div>

      <label>
        Адрес объекта
        <input id="address" placeholder="Адрес">
      </label>

      <div class="form-row">

        <label>
          Дата
          <input id="date" type="date" required>
        </label>

        <label>
          Время
          <input id="time" type="time">
        </label>

      </div>

      <label>
        Тип работы

        <select id="type">
          <option>Видеонаблюдение</option>
          <option>Домофон</option>
          <option>Видеонаблюдение и домофон</option>
          <option>СКУД</option>
          <option>Другое</option>
        </select>

      </label>

      <label>
        Описание

        <textarea
          id="description"
          placeholder="Что необходимо сделать"
        ></textarea>

      </label>

      <label>
        Оплата

        <select id="payment">
          <option>Наличные</option>
          <option>Перевод</option>
          <option>Не оплачено</option>
        </select>

      </label>

      <div class="modal-buttons">

        <button type="button" class="cancel" id="closeModal">
          Отмена
        </button>

        <button type="submit" class="save">
          Сохранить
        </button>

      </div>

    </form>

  </div>

</div>


<script>

  /* ===========================
     TELEGRAM
  =========================== */

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  /* ===========================
     SUPABASE — НАСТРОЙКИ
  =========================== */

  // ============================================================
  // 🔴 ВСТАВЬ СЮДА ДАННЫЕ ИЗ SUPABASE
  //
  // SUPABASE_URL: Project URL
  // SUPABASE_KEY: Publishable key (или старый anon key)
  //
  // НЕ вставляй сюда secret/service_role key!
  // ============================================================

  const SUPABASE_URL = "https://hucvbjjztyemdwevxoot.supabase.co";
  const SUPABASE_KEY = "sb_publishable_xh3SWweIBq70kbTNcFDaJw_ZnkfWzbx";

  // Работаем напрямую через REST API Supabase.
  // Это убирает зависимость от отдельного CDN-скрипта.
  async function supabaseRequest(path, options = {}) {

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);

    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
          ...options,
          signal: controller.signal,
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Accept": "application/json",
            ...(options.headers || {})
          }
        }
      );

      const raw = await response.text();
      let data = null;

      try {
        data = raw ? JSON.parse(raw) : null;
      }
      catch (_) {
        data = raw;
      }

      if (!response.ok) {
        const message =
          data?.message ||
          data?.error_description ||
          data?.hint ||
          (typeof data === "string" ? data : "Supabase HTTP " + response.status);

        throw new Error(message);
      }

      return data;

    }
    catch (error) {

      if (error?.name === "AbortError") {
        throw new Error("Supabase не ответил за 12 секунд. Проверь интернет и настройки базы.");
      }

      throw error;

    }
    finally {
      clearTimeout(timeout);
    }
  }


  /* ===========================
     TELEGRAM USER ID
  =========================== */

  const telegramUser =
    tg?.initDataUnsafe?.user || null;

  const TELEGRAM_USER_ID =
    telegramUser?.id ? Number(telegramUser.id) : null;


  /* ===========================
     ДАННЫЕ ПРИЛОЖЕНИЯ
  =========================== */

  // Теперь jobs загружается из Supabase,
  // а не хранится только в памяти браузера.
  let jobs = [];


  /* ===========================
     ЗАГРУЗКА МОНТАЖЕЙ ИЗ SUPABASE
  =========================== */

  async function loadJobs() {

    if (!TELEGRAM_USER_ID) {
      throw new Error(
        "Не удалось определить Telegram ID. Открой приложение именно внутри Telegram."
      );
    }

    const query =
      "jobs?select=*" +
      "&telegram_id=eq." + encodeURIComponent(TELEGRAM_USER_ID) +
      "&order=date.asc&order=time.asc";

    const data = await supabaseRequest(query);

    jobs = Array.isArray(data) ? data : [];

  }


  /* ===========================
     СОХРАНЕНИЕ НОВОГО МОНТАЖА
  =========================== */

  async function createJob(data) {

    const result =
      await supabaseRequest("jobs", {
        method: "POST",
        headers: {
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          telegram_id: TELEGRAM_USER_ID,
          ...data,
          status: "planned"
        })
      });

    const createdJob = Array.isArray(result) ? result[0] : result;

    if (!createdJob) {
      throw new Error("Supabase не вернул созданный монтаж.");
    }

    jobs.push(createdJob);

    return createdJob;

  }


  /* ===========================
     ОБНОВЛЕНИЕ МОНТАЖА
  =========================== */

  async function updateJob(id, data) {

    const query =
      "jobs?id=eq." + encodeURIComponent(id) +
      "&telegram_id=eq." + encodeURIComponent(TELEGRAM_USER_ID);

    const result =
      await supabaseRequest(query, {
        method: "PATCH",
        headers: {
          "Prefer": "return=representation"
        },
        body: JSON.stringify(data)
      });

    const updatedJob = Array.isArray(result) ? result[0] : result;

    if (!updatedJob) {
      throw new Error("Монтаж не найден или не удалось его изменить.");
    }

    const index =
      jobs.findIndex(j => Number(j.id) === Number(id));

    if (index !== -1) {
      jobs[index] = updatedJob;
    }

    return updatedJob;

  }


  /* ===========================
     УДАЛЕНИЕ МОНТАЖА ИЗ SUPABASE
  =========================== */

  async function removeJob(id) {

    const query =
      "jobs?id=eq." + encodeURIComponent(id) +
      "&telegram_id=eq." + encodeURIComponent(TELEGRAM_USER_ID);

    await supabaseRequest(query, {
      method: "DELETE",
      headers: {
        "Prefer": "return=minimal"
      }
    });

    jobs =
      jobs.filter(j => Number(j.id) !== Number(id));

  }


  /* ===========================
     ПРОВЕРКА НАСТРОЕК SUPABASE
  =========================== */

  function supabaseConfigLooksEmpty() {

    return
      !SUPABASE_URL ||
      !SUPABASE_KEY ||
      SUPABASE_URL.includes("ВСТАВЬ_СЮДА") ||
      SUPABASE_KEY.includes("ВСТАВЬ_СЮДА");

  }


  let currentPage = "home";
  let currentStatus = "planned";

  let calendarDate = new Date();
  let selectedDate = null;


  /* ===========================
     ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
  =========================== */

  function money(value) {

    return Number(value || 0)
      .toLocaleString("ru-RU") + " ₽";

  }


  function formatDate(date) {

    if (!date) return "";

    return new Date(date + "T00:00:00")
      .toLocaleDateString(
        "ru-RU",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

  }


  function statusName(status) {

    if (status === "planned") {
      return "Запланировано";
    }

    if (status === "upcoming") {
      return "Предстоящий монтаж";
    }

    return "Монтаж завершён";

  }


  function statusClass(status) {

    if (status === "planned") {
      return "status-planned";
    }

    if (status === "upcoming") {
      return "status-upcoming";
    }

    return "status-done";

  }


  /* ===========================
     КАРТОЧКА МОНТАЖА
  =========================== */

  function jobCard(job) {

    let nextButton = "";

    if (job.status === "planned") {

      nextButton = `
        <button
          class="next"
          onclick="changeStatus(${job.id}, 'upcoming')"
        >
          → В предстоящие
        </button>
      `;

    }

    if (job.status === "upcoming") {

      nextButton = `
        <button
          class="complete"
          onclick="changeStatus(${job.id}, 'done')"
        >
          ✓ Завершить
        </button>
      `;

    }


    return `

      <article class="job-card">

        <div class="job-header">

          <div>

            <div class="job-name">
              ${escapeHtml(job.name)}
            </div>

            <div class="job-type">
              ${escapeHtml(job.type)}
            </div>

          </div>

          <div class="status ${statusClass(job.status)}">

            ${job.status === "done" ? "✓ " : ""}

            ${statusName(job.status)}

          </div>

        </div>


        <div class="job-info">

          <div>
            📅 ${formatDate(job.date)}
            ${job.time ? " · " + escapeHtml(job.time) : ""}
          </div>

          <div>
            📍 ${escapeHtml(job.address || "Адрес не указан")}
          </div>

          ${
            job.phone
              ? `<div>📞 ${escapeHtml(job.phone)}</div>`
              : ""
          }

        </div>


        ${
          job.description
            ? `
              <div class="job-description">
                ${escapeHtml(job.description)}
              </div>
            `
            : ""
        }


        <div class="job-price">
          💰 ${money(job.price)}
        </div>


        <div class="job-actions">

          <button onclick="editJob(${job.id})">
            ✏️ Изменить
          </button>


          ${
            job.phone
              ? `
                <button onclick="callClient('${escapeAttribute(job.phone)}')">
                  📞 Позвонить
                </button>
              `
              : ""
          }


          ${
            job.address
              ? `
                <button onclick="openMap('${escapeAttribute(job.address)}')">
                  📍 Адрес
                </button>
              `
              : ""
          }


          ${nextButton}


          <button
            class="delete"
            onclick="deleteJob(${job.id})"
          >
            🗑️ Удалить
          </button>

        </div>

      </article>

    `;

  }


  /* ===========================
     ГЛАВНАЯ
  =========================== */

  function renderHome() {

    const planned =
      jobs.filter(j => j.status === "planned").length;

    const upcoming =
      jobs.filter(j => j.status === "upcoming").length;

    const done =
      jobs.filter(j => j.status === "done").length;


    const doneMoney =
      jobs
        .filter(j => j.status === "done")
        .reduce(

  /* ===========================

  function renderCalendar() {

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const firstDay =
      new Date(year, month, 1);

    const lastDay =
      new Date(year, month + 1, 0);

    const start =
      (firstDay.getDay() + 6) % 7;

    const monthName =
      calendarDate.toLocaleDateString(
        "ru-RU",
        {
          month: "long",
          year: "numeric"
        }
      );


    let days = "";


    for (let i = 0; i < start; i++) {

      days += `<div class="day"></div>`;

    }


    for (
      let day = 1;
      day <= lastDay.getDate();
      day++
    ) {

      const iso =
        `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


      const hasJob =
        jobs.some(
          j =>
            j.date === iso &&
            j.status === currentStatus
        );


      days += `

        <button
          class="day ${
            hasJob ? "has-job" : ""
          } ${
            selectedDate === iso ? "selected" : ""
          }"
          onclick="selectCalendarDate('${iso}')"
        >

          ${day}

          ${
            hasJob
              ? `<div class="day-dot"></div>`
              : ""
          }

        </button>

      `;

    }


    const selectedJobs =
      selectedDate
        ? jobs.filter(
            j =>
              j.date === selectedDate &&
              j.status === currentStatus
          )
        : [];


    document.getElementById("content").innerHTML = `

      <div class="section-title">
        ${statusName(currentStatus)}
      </div>


      <div class="status-tabs">

        <button
          class="status-tab ${
            currentStatus === "planned" ? "active" : ""
          }"
          onclick="setStatusFilter('planned')"
        >
          Запланировано
        </button>

        <button
          class="status-tab ${
            currentStatus === "upcoming" ? "active" : ""
          }"
          onclick="setStatusFilter('upcoming')"
        >
          Предстоящие
        </button>

        <button
          class="status-tab ${
            currentStatus === "done" ? "active" : ""
          }"
          onclick="setStatusFilter('done')"
        >
          Завершённые
        </button>

      </div>


      <div class="calendar">

        <div class="calendar-header">

          <button onclick="changeMonth(-1)">
            ‹
          </button>

          <span>
            ${
              monthName.charAt(0).toUpperCase()
              + monthName.slice(1)
            }
          </span>

          <button onclick="changeMonth(1)">
            ›
          </button>

        </div>


        <div class="week">

          <div>Пн</div>
          <div>Вт</div>
          <div>Ср</div>
          <div>Чт</div>
          <div>Пт</div>
          <div>Сб</div>
          <div>Вс</div>

        </div>


        <div class="days">
          ${days}
        </div>

      </div>


      ${
        selectedDate
          ? `

            <div class="section-title">
              ${formatDate(selectedDate)}
            </div>

            ${
              selectedJobs.length
                ? selectedJobs.map(jobCard).join("")
                : `
                  <div class="empty">
                    На эту дату монтажей нет
                  </div>
                `
            }

          `
          : `
            <div class="empty">
              Выбери дату в календаре
            </div>
          `
      }

    `;

  }

  function renderClients() {

    const clients = {};


    jobs.forEach(job => {

      const key =
        job.phone || job.name;


      if (!clients[key]) {

        clients[key] = {
          name: job.name,
          phone: job.phone,
          jobs: []

      clients[key].jobs.push(job);

      Object.values(clients);

      renderCurrentPage();

    catch (error) {

    const confirmed = confirm(
      `Удалить монтаж клиента «${job.name}»?\n\n` +

      `Адрес: ${job.address || "не указан"}\n\n` +

    try {

    catch (error) {

  async function deleteClient(identifier) {

    const client =
      jobs.find(
        j => (j.phone || j.name) === identifier
      );

    if (!client) return;

    const clientJobs =
      jobs.filter(
        j => (j.phone || j.name) === identifier
      );

    const confirmed = confirm(
      `Удалить клиента «${client.name}»?\n\n` +
      `Будет удалено монтажей: ${clientJobs.length}\n\n` +
      `Вместе с ними удалится вся история этого клиента.\n\n` +
      `Это действие нельзя отменить.`
    );

    if (!confirmed) return;

    const ids = clientJobs.map(j => j.id);
    if (!ids.length) return;

    const query =
      "jobs?id=in.(" + ids.map(id => encodeURIComponent(id)).join(",") + ")" +
      "&telegram_id=eq." + encodeURIComponent(TELEGRAM_USER_ID);

    try {

      await supabaseRequest(query, {
        method: "DELETE",
        headers: {
          "Prefer": "return=minimal"
        }
      });

      jobs =
        jobs.filter(
          j => (j.phone || j.name) !== identifier
        );

      renderClients();

    }
    catch (error) {

      console.error(error);

      alert(
        "Не удалось удалить клиента.\n\n" +
        (error.message || "Ошибка Supabase")
      );

    }

  }

  /* ===========================
     БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА
  =========================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "");

  }

      alert(
        "Не найден Telegram ID.\n\n" +
        "Открой приложение через Telegram Mini App."
      );

      renderHome();
      return;

    }


    // Сначала сразу показываем интерфейс.
    // База подгружается после этого, поэтому приложение не зависает на пустом экране.
    renderHome();

    try {

      await loadJobs();
      renderHome();

    }
    catch (error) {

      console.error(error);

      document.getElementById("content").innerHTML = `
        <div class="empty">
          <div style="font-size:30px;margin-bottom:10px;">⚠️</div>
          <b>Не удалось загрузить данные</b>
          <div style="margin-top:8px;font-size:12px;">
            Проверь настройки Supabase, таблицу jobs и RLS.
          </div>
          <div style="margin-top:10px;font-size:11px;word-break:break-word;">
            ${escapeHtml(error.message || "Неизвестная ошибка")}
          </div>
          <button
            style="margin-top:12px;padding:10px 14px;border:0;border-radius:10px;background:#248cff;color:white;font-weight:700;"
            onclick="startApp()"
          >
            Повторить подключение
          </button>
        </div>
      `;

    }

  }


  startApp();

</script>

</body>
</html>
