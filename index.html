<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал монтажника</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .main-button {
      background: #222;
      color: white;
      grid-column: span 2;
    }

    .secondary {
      background: white;
      border: 1px solid #ddd;
    }

    .calendar-button {
      background: white;
      border: 1px solid #ddd;
      grid-column: span 2;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .time {
      font-weight: bold;
      font-size: 18px;
    }

    .name {
      font-size: 17px;
      font-weight: 600;
      margin-top: 5px;
    }

    .info {
      color: #666;
      margin-top: 5px;
      line-height: 1.4;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }

    .hidden {
      display: none;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .back {
      background: #eee;
      margin-bottom: 15px;
    }

    .save {
      background: #222;
      color: white;
      width: 100%;
    }


    /* =========================
       КАЛЕНДАРЬ
       ========================= */

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .calendar-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      flex: 1;
    }

    .month-button {
      width: 44px;
      height: 44px;
      padding: 0;
      background: white;
      border: 1px solid #ddd;
      font-size: 22px;
    }

    .today-button {
      width: 100%;
      background: white;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }

    .calendar {
      background: white;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekday {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 8px 0;
      font-weight: 600;
    }

    .day {
      position: relative;
      height: 48px;
      margin: 2px;
      padding: 0;
      border-radius: 12px;
      background: transparent;
      font-size: 15px;
    }

    .day:active {
      background: #eee;
    }

    .day.other-month {
      color: #bbb;
    }

    .day.today {
      background: #222;
      color: white;
    }
